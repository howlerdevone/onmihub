services:
  postgres:
    image: postgres:16-alpine
    container_name: omnihub_postgres
    restart: always
    environment:
      POSTGRES_USER: omni_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: omnihub_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: omnihub_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
